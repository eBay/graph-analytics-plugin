name: PR Build
on:
  pull_request:
  workflow_dispatch:
    inputs:
      gradle-matrix:
        description: 'Gradle Matrix'
        default: '["8.11.1", "8.12.1", "8.13", "8.14.1", "release-candidate", "nightly"]'
        required: false
jobs:
  gradle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gradle-version: ${{ fromJSON(inputs.gradle-matrix) || ["8.11.1", "8.12.1", "8.13", "8.14.1", "release-candidate", "nightly"] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
            gradle-version: ${{ matrix.gradle-version }}
      - name: Build Plugin
        run: ./gradlew build
      - name: Sample Analysis
        working-directory: sample
        run: ../gradlew graphAnalysis
      - name: Sample Inspection
        working-directory: sample
        run: ../gradlew :app:graphInspection
